name: EMA High/Low Alert — 4h (BTC-USDT-SWAP)

on:
  # Расписание — на cron-job.org:
  # POST https://api.github.com/repos/<USER>/<REPO>/actions/workflows/EMA-4h.yml/dispatches
  # Body: {"ref":"main"}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ema-alert-4h
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ema-state-4h-${{ github.run_id }}
          restore-keys: |
            ema-state-4h-

      - name: Run bot
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TF_FILTER: "4h"
        run: python ema_alert_bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: ema-state-4h-${{ github.run_id }}
